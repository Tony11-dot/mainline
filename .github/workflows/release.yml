name: Store release
# Tag v1.2.3 → iOS build on TestFlight + Android bundle on the Google Play internal testing track.
# Version = the tag; build number = the latest one in each store + 1. Setup: apps/mobile/store/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.2.0)
        required: true

concurrency:
  group: store-release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  MAINLINE_API_URL: ${{ vars.PUBLIC_API_URL }}
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'

jobs:
  ios:
    name: iOS → TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.4', bundler-cache: true, working-directory: apps/mobile }
      - run: pnpm install --frozen-lockfile
      - name: fastlane ios beta
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            apps/mobile/build/ios/*.ipa
            apps/mobile/build/ios/*.dSYM.zip
          if-no-files-found: ignore

  android:
    name: Android → Play internal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.4', bundler-cache: true, working-directory: apps/mobile }
      - run: pnpm install --frozen-lockfile
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: fastlane android internal
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
