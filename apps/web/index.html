<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F9FAFD" />
    <meta name="description" content="MainLine — master your chess openings, branch by branch." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MainLine</title>
    <script>
      // Paint the user's theme before React loads (values cached by lib/prefs.ts).
      (function () {
        try {
          var b = JSON.parse(localStorage.getItem('mainline.boot') || 'null');
          var r = document.documentElement;
          if (b) {
            for (var k in b.vars) r.style.setProperty(k, b.vars[k]);
            r.dataset.theme = b.dark ? 'dark' : 'light';
            r.dataset.board = b.board || 'match';
            if (b.font) r.style.setProperty('--font-sans-live', b.font);
          } else {
            r.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            r.dataset.board = 'match';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
