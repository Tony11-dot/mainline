<!doctype html>
<!--
  MainLine App Store screenshot template (the same system as ClassNotes').
  Renders ONE panel from panels.js, chosen by ?id=<panel id>, at the exact App
  Store canvas size. render.py drives it with headless Chrome; open it in a
  browser with ?id=ipad-01 (and &raw=<folder URL> when the raw shots aren't in
  raw/) to preview.

  Look: one flat colour per panel (MainLine's own brand blue and the app's
  theme shades: paper, sky, mint, sand, peach, midnight), a big friendly serif
  headline (Fraunces, OFL — see fonts/), one hand-drawn ink swash under a
  word, a short Cabinet Grotesk line under it (the app's own bundled face),
  and the real app on a plain device cropped by the panel's foot. No
  gradients, no patterns, no glows.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MainLine screenshots</title>
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("fonts/Fraunces.ttf") format("truetype");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Cabinet Grotesk";
    src: url("../../apps/web/src/assets/fonts/cabinet-grotesk/CabinetGrotesk-Medium.woff2") format("woff2");
    font-weight: 500;
  }

  /* Panel colours: ONE family, MainLine's own. The brand blue of the icon
     (#072EB8), its ink navy, and two calm tints of the blue. Text is AA (>= 4.5:1)
     on each; the swash is the one accent. */
  .brand { --bg: #072EB8; --ink: #FFFFFF; --sub: #D9E1FF; --swash: #FFD45E; }
  .mist  { --bg: #E4EAFB; --ink: #0E1A47; --sub: #435078; --swash: #072EB8; }
  .ink   { --bg: #0E1428; --ink: #EEF0F5; --sub: #AEB8D4; --swash: #8FA6FF; }
  .sky   { --bg: #CBDAF5; --ink: #0E1A47; --sub: #3A4A72; --swash: #072EB8; }

  html, body { margin: 0; padding: 0; }
  #canvas {
    position: relative; overflow: hidden; background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .copy { position: absolute; left: 0; right: 0; text-align: center; z-index: 5; }
  h1 {
    margin: 0 auto; color: var(--ink);
    font-family: "Fraunces", Georgia, serif; font-weight: 440;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 0;
    letter-spacing: -0.018em; line-height: 1.02;
  }
  h1 em { font-style: normal; position: relative; white-space: nowrap; }
  .sub {
    margin: 0 auto; color: var(--sub);
    font-family: "Cabinet Grotesk", system-ui, sans-serif; font-weight: 500;
    letter-spacing: -0.005em; line-height: 1.3;
  }
  svg.swash { position: absolute; overflow: visible; pointer-events: none; z-index: 4; }
  svg.swash path { fill: var(--swash); }

  /* ── Devices ── A plain black frame, a hairline of metal at its edge, the
     screen inset by the real bezel, and a soft shadow falling down. */
  .device {
    position: absolute; z-index: 2; box-sizing: border-box;
    background: #161618;
    box-shadow:
      0 0 0 3px #3A3A3D,
      0 0 0 4px #1C1C1E,
      0 70px 120px -30px rgba(30, 22, 14, 0.30),
      0 26px 50px -18px rgba(30, 22, 14, 0.22);
    transform-origin: 50% 0%;
  }
  .device .screen { position: absolute; overflow: hidden; background: #fff; }
  .device .screen img { display: block; width: 100%; height: 100%; }
  .island { position: absolute; background: #000; border-radius: 999px; z-index: 3; }
</style>
</head>
<body>
<div id="canvas"></div>
<script src="panels.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  // ?card=1: a title card for the App Preview videos — the same colour,
  // type and swash, no device — at ?w= x ?h=, saying ?headline=.
  const card = params.has("card");
  const panel = card
    ? { id: "card-" + params.get("headline"), device: params.get("device") || "iphone", card: true,
        color: params.get("color") || "cream", headline: params.get("headline"),
        size: +params.get("size") || undefined, swash: params.get("swash") || undefined,
        sub: params.get("sub") || undefined }
    : window.PANELS.find(p => p.id === params.get("id")) || window.PANELS[0];
  const raw = params.get("raw") || "raw/";
  const size = card ? { width: +params.get("w"), height: +params.get("h") } : window.CANVAS[panel.device];
  const phone = panel.device === "iphone";

  const canvas = document.getElementById("canvas");
  canvas.className = panel.color;
  canvas.style.width = size.width + "px";
  canvas.style.height = size.height + "px";

  // ── Copy ──────────────────────────────────────────────────────────────
  const copy = document.createElement("div");
  copy.className = "copy";
  copy.style.top = (phone ? 250 : 230) + "px";
  const h1 = document.createElement("h1");
  h1.innerHTML = panel.headline;
  h1.style.fontSize = (panel.size || (phone ? 126 : 172)) + "px";
  h1.style.maxWidth = (phone ? 1180 : 1800) + "px";
  copy.appendChild(h1);
  if (panel.sub) {
    const sub = document.createElement("p");
    sub.className = "sub";
    sub.innerHTML = panel.sub;
    sub.style.fontSize = (phone ? 46 : 56) + "px";
    sub.style.maxWidth = (phone ? 1080 : 1500) + "px";
    sub.style.marginTop = (phone ? 54 : 60) + "px";
    copy.appendChild(sub);
  }
  canvas.appendChild(copy);
  if (card) h1.style.maxWidth = (size.width * 0.86) + "px";

  // ── Device ────────────────────────────────────────────────────────────
  const pose = panel.pose || {};
  const width = pose.width || (phone ? 1170 : 1960);
  // Real proportions: iPad Pro 13" (M5) and iPhone 17 Pro, outer frame to
  // screen, corner radii as fractions of the frame's width.
  const spec = phone
    ? { bezel: 0.036, radius: 0.175, screenRadius: 0.142, aspect: 2868 / 1320 }
    : { bezel: 0.031, radius: 0.086, screenRadius: 0.058, aspect: 2752 / 2064 };
  const bezel = width * spec.bezel;
  const screenWidth = width - 2 * bezel;
  const screenHeight = screenWidth * (panel.aspect || spec.aspect);
  const device = document.createElement("div");
  device.className = "device";
  device.style.width = width + "px";
  device.style.height = (screenHeight + 2 * bezel) + "px";
  device.style.borderRadius = (width * spec.radius) + "px";
  device.style.left = ((size.width - width) / 2 + (pose.x || 0)) + "px";
  // Under the copy (measured once the fonts are in), unless a pose says.
  const placeDevice = () => {
    const below = copy.getBoundingClientRect().bottom + (phone ? 110 : 130);
    device.style.top = (pose.top || below) + "px";
  };
  if (pose.tilt) device.style.transform = `rotate(${pose.tilt}deg)`;
  const screen = document.createElement("div");
  screen.className = "screen";
  Object.assign(screen.style, {
    left: bezel + "px", top: bezel + "px", width: screenWidth + "px", height: screenHeight + "px",
    borderRadius: (width * spec.screenRadius) + "px"
  });
  const img = document.createElement("img");
  img.src = raw + panel.shot;
  screen.appendChild(img);
  device.appendChild(screen);
  if (phone) {
    const island = document.createElement("div");
    island.className = "island";
    const w = screenWidth * 0.313, h = screenWidth * 0.092;
    Object.assign(island.style, {
      width: w + "px", height: h + "px", left: (bezel + (screenWidth - w) / 2) + "px",
      top: (bezel + screenHeight * 0.0128) + "px"
    });
    device.appendChild(island);
  }
  if (!card) canvas.appendChild(device);

  // ── The swash: one pen stroke under the <em> word ─────────────────────
  // Seeded, so a panel draws the same stroke every time. A centreline that
  // rises a little and wanders, a nib that lands quickly, swells and lifts
  // into a thin tail; outlined into one filled shape.
  function random(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function strokeOutline(points, widths) {
    const left = [], right = [];
    for (let i = 0; i < points.length; i++) {
      const a = points[Math.max(i - 1, 0)], b = points[Math.min(i + 1, points.length - 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len, w = widths[i] / 2;
      left.push([points[i][0] + nx * w, points[i][1] + ny * w]);
      right.push([points[i][0] - nx * w, points[i][1] - ny * w]);
    }
    const ring = left.concat(right.reverse());
    return "M" + ring.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L") + " Z";
  }
  function drawSwash() {
    const word = h1.querySelector("em");
    if (!word) return;
    const box = word.getBoundingClientRect();
    const host = canvas.getBoundingClientRect();
    const rand = random(panel.seed || panel.id.split("").reduce((s, c) => s * 31 + c.charCodeAt(0), 7));
    const fontSize = parseFloat(h1.style.fontSize);
    const w = box.width * 1.06, x0 = box.left - host.left - box.width * 0.03;
    const y0 = box.bottom - host.top - fontSize * 0.01;
    const nib = fontSize * (panel.nib || 0.13);
    const rise = fontSize * (0.015 + rand() * 0.03);
    const bow = fontSize * (0.05 + rand() * 0.04);
    const p1 = rand() * 6.28, p2 = rand() * 6.28;
    const n = 160, points = [], widths = [];
    // First pass: left to right.
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = x0 + w * t;
      const y = y0 + bow * Math.sin(Math.PI * t) * 0.6 - rise * t
        + fontSize * 0.012 * Math.sin(t * 5.1 + p1) + fontSize * 0.006 * Math.sin(t * 13 + p2);
      const land = Math.min(1, 0.25 + t / 0.06);
      const lift = Math.pow(Math.min(1, (1 - t) / 0.45), 0.8);
      const press = 0.72 + 0.3 * Math.sin(t * 3.4 + p2) + 0.08 * Math.sin(t * 11 + p1);
      points.push([x, y]);
      widths.push(Math.max(nib * 0.12, nib * land * (0.35 + 0.65 * lift) * press));
    }
    let d = strokeOutline(points, widths);
    // A short return flick on some panels: back under the word, thinner.
    if (panel.swash === "loop") {
      const back = [], bw = [];
      const sx = points[n][0], sy = points[n][1];
      for (let i = 0; i <= 120; i++) {
        const t = i / 120;
        const x = sx - w * 0.62 * Math.pow(t, 0.85) + fontSize * 0.05 * Math.sin(Math.PI * Math.min(1, t * 3));
        const y = sy + fontSize * 0.21 * Math.sin(Math.PI / 2 * Math.min(1, t * 1.7)) + fontSize * 0.03 * t;
        back.push([x, y]);
        bw.push(Math.max(nib * 0.08, nib * 0.55 * Math.min(1, 0.35 + t / 0.08) * Math.pow(1 - t, 1.1)));
      }
      d += " " + strokeOutline(back, bw);
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "swash");
    svg.setAttribute("width", size.width);
    svg.setAttribute("height", size.height);
    svg.style.left = "0px"; svg.style.top = "0px";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    svg.appendChild(path);
    canvas.appendChild(svg);
  }
  document.fonts.ready.then(() => {
    if (card) copy.style.top = ((size.height - copy.getBoundingClientRect().height) / 2 - size.height * 0.03) + "px";
    else placeDevice();
    drawSwash();
  });
})();
</script>
</body>
</html>
